<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --sea1: #8fd3f4;
      --sea2: #3a9bd0;
      --sea3: #1b5f96;
      --sea4: #0e3560;
      --card: #fff1cf;
      --tx: #2b1a08;
      --mut: #7a5a35;
      --ac: #c8102e;
      --gold: #d99a1b;
      --bd: #2b1a08;
      --inp: #fffaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--tx);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      background: linear-gradient(var(--sea1) 0 22%, var(--sea2) 22% 48%, var(--sea3) 48% 74%, var(--sea4) 74%) fixed var(--sea3);
    }

    #darkness-overlay {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #000;
      opacity: 0.1;
      pointer-events: none;
      z-index: 1;
      transition: opacity 1s steps(6);
    }

    .deco {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .deco i {
      position: absolute;
      display: block;
      image-rendering: pixelated;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: center;
    }

    .lan {
      width: 54px;
      height: 84px;
      transform-origin: 50% 0;
      animation: sway 3s steps(3) infinite alternate;
      top: 0;
    }
    .l1 { left: 6px; }
    .l2 { right: 6px; animation-delay: -1.5s; }

    .cld {
      width: 96px;
      height: 36px;
      opacity: 0.9;
      left: -120px;
      animation: drift 90s linear infinite;
    }
    .c1 { top: 70px; }
    .c2 { top: 130px; width: 72px; height: 27px; animation-delay: -45s; }

    .koi {
      width: 64px;
      height: 28px;
      left: 100%;
      animation: swim 50s steps(120) infinite;
    }
    .k1 { bottom: 12%; }
    .k2 { bottom: 28%; animation-duration: 70s; animation-delay: -20s; }
    .k3 { bottom: 45%; animation-duration: 90s; animation-delay: -55s; }

    @keyframes sway {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5deg); }
    }
    @keyframes drift {
      to { left: calc(100% + 120px); }
    }
    @keyframes swim {
      to { left: -100px; }
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 14px;
    }

    .mea {
      height: 18px;
      margin: 8px 0 12px;
      background-color: var(--ac);
      background-repeat: repeat-x;
      background-size: auto 18px;
      image-rendering: pixelated;
      border: 3px solid var(--bd);
    }

    h1 {
      margin: 6px 0 0;
      text-align: center;
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 6px;
      text-shadow: 3px 3px 0 var(--bd), -1px -1px 0 var(--bd), 1px -1px 0 var(--bd), -1px 1px 0 var(--bd);
    }

    .seal {
      display: inline-block;
      background: var(--ac);
      color: #fff;
      border: 3px solid var(--bd);
      font-size: 16px;
      letter-spacing: 0;
      padding: 0 6px;
      vertical-align: middle;
      transform: rotate(-5deg);
      text-shadow: none;
    }

    .sub {
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 0 var(--bd);
      margin: 0 0 4px;
      font-weight: bold;
    }

    .card {
      background: var(--card);
      border: 4px solid var(--bd);
      box-shadow: 5px 5px 0 var(--bd);
      padding: 16px;
      margin: 0 0 16px;
    }

    .px {
      font-family: "Press Start 2P", monospace;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      color: #fff;
      text-shadow: 2px 2px 0 var(--bd);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .dep {
      height: 14px;
      border: 3px solid var(--bd);
      background: var(--card);
      margin-bottom: 12px;
    }

    .dep i {
      display: block;
      height: 100%;
      background: repeating-linear-gradient(90deg, var(--ac) 0 8px, transparent 8px 10px);
      transition: width .6s steps(8);
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      border: 3px solid var(--bd);
      background: var(--gold);
      color: #2b1a08;
      padding: 0 8px;
      margin-right: 4px;
      font-weight: bold;

    .pr {

      font-weight: 700;
      margin: 10px 0;
    }

    .tb {
      height: 12px;
      border: 3px solid var(--bd);

      background: var(--inp);
    }

    .tb i {
      display: block;
      height: 100%;
      width: 100%;
      background: repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 10px);
      transition: width 0.1s linear;
    }

    .left {
      text-align: right;
      color: var(--mut);
      font-size: 13px;
      margin-top: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;

      font-size: 18px;
      padding: 10px;
      border: 4px solid var(--bd);
      border-radius: 0;
      background: var(--inp);
      color: var(--tx);
      margin-bottom: 12px;
      outline: none;
      font-weight: bold;
    }

    input:focus {
      border-color: var(--ac);
    }

    input:disabled {
      opacity: 0.7;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 4px solid var(--bd);
      border-radius: 0;
      padding: 10px 24px;
      background: var(--ac);
      color: #fff;
      box-shadow: 0 5px 0 var(--bd);
      font-weight: bold;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: none;
    }

    button:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .go {
      width: 100%;
    }

    .alt {
      background: var(--card);
      color: var(--tx);
    }

    .beg {
      background-color: #d99a1b;
      border-color: #2b1a08;
      color: #2b1a08;
    }

    .badge {
      display: inline-block;
      color: #fff;
      border: 3px solid var(--bd);
      padding: 0 12px;
      font-weight: 700;
      margin: 6px 0;
      background: var(--c, #6b7a90);
    }

    .t0 { --c: #6b7a90; }
    .t1 { --c: #3a9fd8; }
    .t3 { --c: #2f5fd0; }
    .t5 { --c: #8a2fb8; }
    .t6 { --c: #c98a10; }

    .hint {
      color: var(--mut);
      font-size: 14px;
      margin: 6px 0 12px;
    }

    .big {
      font-size: 26px;
      color: var(--ac);
      text-align: center;
      margin: 12px 0;
    }

    .c {
      text-align: center;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      padding: 4px 0;
      border-top: 3px dotted var(--bd);

    .row span:first-child {
      color: var(--mut);
      font-weight: bold;
    }

    h3 {
      margin: 14px 0 6px;

    }

    .dr {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin: 3px 0;
      font-weight: bold;
    }

    .dl {

    }

    .db {
      flex: 1;
      height: 14px;
      border: 3px solid var(--bd);
      background: var(--inp);
    }

    .db i {
      display: block;
      height: 100%;
      background: var(--c, #6b7a90);
    }

    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.6em;
      color: var(--ac);
      margin-bottom: 2px;
    }

  <script>
    // --- PIXEL ART SVG GENERATOR ---
    function spr(map, pal) {
      const h = map.length;
      const w = map[0].length;
      let r = "";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const c = pal[map[y][x]];
          if (c) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
        }
      }
      return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`)}")`;
    }

    const vLan = spr(["....k....","....k....","..yyyyy..",".rrrrrrr.","rrorrrrdr","rrorrrrdr","rrorrrrdr","rrorrrrdr","rrorrrrdr",".rrrrrrr.","..yyyyy..","....y....","...y.y...","...y.y..."],{r:"#c8102e",d:"#8a0c20",o:"#ff5a3c",y:"#f2c14e",k:"#3b2a1a"});
    const vKoi = spr(["....rr.......rr.","...rrrrr....rrrr","..rwwwwwrrrrrrr.",".rwwkwwwwwrrr...","..rwwwwwrrrrrrr.","...rrrrr....rrrr","....rr.......rr."],{r:"#ff5a2c",w:"#fff4e0",k:"#2b1a08"});
    const vCld = spr(["....www.........","..wwwwwww..www..",".wwwwwwwwwwwwwww","wwwwwwwwwwwwwwww",".bbbbbbbbbbbbbb.","..bbbbbbbbbbbb.."],{w:"#ffffff",b:"#cfe8ff"});
    const vMea = spr(["gggggggg","g.......","g.ggggg.","g.g...g.","g.g.g.g.","g.g.ggg.","g.g.....","gggggggg"],{g:"#f2c14e"});

    // Apply pixel SVG backgrounds
    document.querySelectorAll('.lan').forEach(el => el.style.backgroundImage = vLan);
    document.querySelectorAll('.cld').forEach(el => el.style.backgroundImage = vCld);
    document.querySelectorAll('.koi').forEach(el => el.style.backgroundImage = vKoi);
    document.querySelectorAll('.mea').forEach(el => el.style.backgroundImage = vMea);

    // --- AI-POWERED QUESTION BANKS ---

    function parseAIDB(dataString) {
      return dataString.trim().split('\n').filter(line => line.trim()).map((line, idx) => {
        const [cat, q] = line.split('|');
        return { id: `ai_${idx}`, category: cat.trim(), q: q.trim() };
      });
    }

    function parseBeginner(dataString) {
      return dataString.trim().split('\n').filter(line => line.trim()).map((line, idx) => {
        const [cat, qAndPinyin] = line.split('|');
        const qParts = qAndPinyin.split(' (');
        const qRawPinyin = qParts[0];
        const english = qParts[1] ? `(${qParts[1]}` : '';
        const cleanQ = qRawPinyin.replace(/\([a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+\)/g, '');
        const qHtml = qRawPinyin.replace(/(.)\(([a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
        return { id: `b_${idx}`, category: cat.trim(), q: qHtml, rawQ: cleanQ, english };
      });
    }

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex > 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    function getUniqueCategoryQuestions(bank, count, seed = null) {
      let shuffled = [...bank];
      if (seed !== null) {
        let t = seed;
        const random = () => {
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
      } else {
        shuffled = shuffle(shuffled);
      }

      const selected = [];
      const usedCategories = new Set();

      for (const q of shuffled) {
        if (!usedCategories.has(q.category)) {
          selected.push(q);
          usedCategories.add(q.category);
          if (selected.length === count) break;
        }
      }

      if (selected.length < count) {
        for (const q of shuffled) {
          if (!selected.includes(q)) {
            selected.push(q);
            if (selected.length === count) break;
          }
        }
      }

      return selected;
    }

    function startTimer() {
      stopTimer();
      state.timerInterval = setInterval(() => {
        if (state.gameState !== 'playing' || state.isOver || state.isChecking) return;
        state.timeLeft -= 0.1;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;

        clearInterval(state.timerInterval);

      }

    function startGame(selectedMode) {
      let selectedQs = [];
      if (selectedMode === 'daily') {
        const d = new Date();
        const seed = d.getFullYear() * 1000 + Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        selectedQs = getUniqueCategoryQuestions(DAILY_BANK, 7, seed);
      } else if (selectedMode === 'unlimited') {
        selectedQs = getUniqueCategoryQuestions(UNLIMITED_BANK, 7, null);
      } else if (selectedMode === 'beginner') {
        selectedQs = getUniqueCategoryQuestions(BEGINNER_BANK, 7, null);
      }

      state.mode = selectedMode;
      state.questions = selectedQs;
      state.currentQIndex = 0;
      state.scoreMeters = 0;
      state.history = [];
      state.tried = [];
      state.totalTime = selectedMode === 'beginner' ? 45 : 25;
      state.timeLeft = state.totalTime;
      state.gameState = 'playing';
      state.errorMsg = '';
      state.isChecking = false;
      state.isOver = false;
      state.flash = null;

      render();
      startTimer();
    }

    function handleTimeOut() {
      stopTimer();
      state.isOver = true;
      const currentQ = state.questions[state.currentQIndex];
      state.history.push({
        q: currentQ.q,
        a: '',
        depth: 0,
        level: 0,
        rarity: '未收录'
      });
      state.flash = { msg: "时间到，没有在规定时间内答出。", type: 0 };
      render();
    }

      state.isChecking = true;

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            guess,
            mode: gameMode
          })
        });

        if (!response.ok) {
          let errDetail = `HTTP ${response.status}`;
          try {
            const errJson = await response.json();
            if (errJson && errJson.reason) errDetail = errJson.reason;
          } catch (_) {}
          throw new Error(errDetail);
        }

        const data = await response.json();
        return data;
      } catch (err) {
        console.error('Proxy request failed:', err);
        return {
          valid: false,
          error: true,
          reason: err.message && err.message !== 'Failed to fetch'
            ? err.message
            : "无法连接到 /api/judge（请确保已部署到 Vercel 且配置了 GROQ_API_KEY）"
        };
      } finally {
        state.isChecking = false;
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (state.isOver || state.isChecking) return;

      const inputEl = document.getElementById('in');
      const guess = inputEl ? inputEl.value.trim() : '';
      if (!guess) return;

      const currentQ = state.questions[state.currentQIndex];
      const questionTextForAI = currentQ.rawQ || currentQ.q;
      const aiResult = await checkAnswerWithProxy(questionTextForAI, guess, state.mode);

      if (aiResult.error) {
        state.errorMsg = `⚠️ ${aiResult.reason}`;
      } else if (aiResult.valid) {
        stopTimer();
        state.isOver = true;

        const depthMap = { 1: 10, 3: 25, 5: 50, 6: 100 };
        const depth = depthMap[aiResult.rarity] || 10;
        const level = aiResult.rarity === 1 ? 1 : aiResult.rarity === 3 ? 3 : aiResult.rarity === 5 ? 5 : 6;

        state.scoreMeters += depth;
        state.history.push({
          q: currentQ.q,
          a: aiResult.primaryName || guess,
          depth: depth,
          level: level,
          rarity: TIERS[level]
        });

        let hintMsg = level === 6 ? "太强了！已经是这道题最深的一档了！" : "还可以想出更冷门的答案！";
        if (aiResult.reason) hintMsg += `（AI简评：${aiResult.reason}）`;
        state.flash = { msg: hintMsg, type: level, points: depth * 10 };
      } else {
        if (!state.tried.includes(guess)) {
          state.tried.push(guess);
        }
        state.errorMsg = `✖ 判定无效！${aiResult.reason || '这不是一个可接受的答案。'} 已试：${state.tried.join("、")}`;
      }

      render();
    }

    function nextQuestion() {
      if (state.currentQIndex < 6) {
        state.currentQIndex += 1;
        state.totalTime = state.mode === 'beginner' ? 45 : 25;
        state.timeLeft = state.totalTime;
        state.tried = [];
        state.errorMsg = '';
        state.isChecking = false;
        state.isOver = false;
        state.flash = null;
        render();
        startTimer();
      } else {
        stopTimer();
        state.gameState = 'results';
        render();
      }
    }

    function goToMenu() {
      stopTimer();
      state.gameState = 'menu';
      render();
    }

    // --- RENDERERS ---
    function renderMenu() {
      return `
        <div class="card c">
          <p class="pr">越冷门的答案，潜得越深</p>
          <p class="hint">每局 7 道题，答错不扣分，限时内可以一直换答案重试。由云端 AI 裁判实时鉴定冷门程度，无需配置任何密钥，越冷门的答案潜得越深，每题最高潜入 1000 米。</p>
          
          <button class="go" onclick="startGame('daily')">📅 每日挑战</button>
          <p class="hint">按天轮换，所有人同一套（北京时间0点更新）。</p>
          
          <button class="go alt" onclick="startGame('unlimited')">♾️ 无限模式</button>
          <p class="hint">独立开放题库，每次随机抽取新的 7 题。</p>

          <button class="go beg" onclick="startGame('beginner')">🔋 新手模式</button>
          <p class="hint">适合汉语学习者的文化题库，45秒倒计时，自带拼音提示，AI 裁判超宽容判定。</p>
        </div>
      `;
    }

    function renderPlaying() {
      const q = state.questions[state.currentQIndex];
      const modeLabel = state.mode === 'daily' ? '每日挑战' : state.mode === 'beginner' ? '新手模式' : '无限模式';
      const lastAnswer = state.history[state.history.length - 1];

      return `
        <div class="bar">
          <span class="px" style="font-size: 11px;">${state.scoreMeters * 10} M</span>
          <span>${modeLabel}</span>
          <span class="px" style="font-size: 11px;">7000 M</span>
        </div>

        <div class="dep">
          <i style="width: ${(state.scoreMeters / 700) * 100}%;"></i>
        </div>

        <div class="card">
          <span class="tag">第 ${state.currentQIndex + 1} / 7 题</span>
          <p class="pr">
            ${q.q}
            ${state.mode === 'beginner' && q.english ? `<span class="hint" style="display:block; margin-top:5px;">${q.english}</span>` : ''}
          </p>

          ${!state.isOver ? `
            <div class="tb"><i id="tb-fill" style="width: ${(state.timeLeft / state.totalTime) * 100}%;"></i></div>
            <form onsubmit="handleFormSubmit(event)">
              <input
                id="in"
                autocomplete="off"
                placeholder="输入你的答案…"
                maxlength="30"
                ${state.isChecking ? 'disabled' : ''}
              />
              <button type="submit" class="go" ${state.isChecking ? 'disabled' : ''}>
                ${state.isChecking ? 'AI 裁判鉴定中...' : '提交'}
              </button>
            </form>
            <div class="hint" id="msg">${state.errorMsg || "答错不扣分，限时内可以一直重试，越冷门越好。"}</div>
            <div class="left" id="tl">${Math.ceil(state.timeLeft)} 秒</div>
          ` : `
            <div>你的答案：<b>${lastAnswer?.a || '（未作答）'}</b></div>
            ${state.flash?.type > 0 ? `<div class="badge t${state.flash.type}">${TIERS[state.flash.type]} · +${state.flash.points} 米</div>` : ''}
            <div class="hint">${state.flash?.msg || ''}</div>
            <button class="go" onclick="nextQuestion()">${state.currentQIndex === 6 ? "查看结果" : "下一题"}</button>
          `}
        </div>
      `;
    }

    function renderResults() {
      const totalMeters = state.scoreMeters * 10;
      const title = totalMeters >= 6000 ? "磷虾之王 👑" : totalMeters >= 4500 ? "海沟猎手" : totalMeters >= 3000 ? "深海探险家" : totalMeters >= 1500 ? "熟练潜水员" : "浅滩游客";
      const modeLabel = state.mode === 'daily' ? '每日挑战' : state.mode === 'beginner' ? '新手模式' : '无限模式';

      const counts = [0, 0, 0, 0, 0, 0, 0];
      state.history.forEach(h => { counts[h.level]++; });

      const rowsHtml = state.history.map(h => {
        const cleanTitle = h.q.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]*>?/gm, '');
        return `
          <div class="row">
            <span>${cleanTitle}</span>
            <span><b>${h.a || '（未作答）'}</b> · ${TIERS[h.level]}</span>
          </div>
        `;
      }).join('');

      const distHtml = [6, 5, 3, 1, 0].map(lvl => `
        <div class="dr">
          <span class="dl">${TIERS[lvl]}</span>
          <span class="db"><i class="t${lvl}" style="width: ${(counts[lvl] / 7) * 100}%;"></i></span>
          <b>${counts[lvl]}</b>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="c hint">${modeLabel}</div>
          <div class="big px">${totalMeters} M</div>
          <div class="c pr">${title}</div>

          ${rowsHtml}

          <h3>本局答案稀有度分布</h3>
          ${distHtml}

          <p></p>
          ${state.mode !== 'unlimited' ? `<button class="go alt" style="margin-bottom:10px;" onclick="startGame('unlimited')">♾️ 去无限模式</button>` : ''}
          <button class="go" style="margin-bottom:10px;" onclick="goToMenu()">返回首页</button>
        </div>
      `;
    }

    function render() {
      updateDarkness();
      if (state.gameState === 'menu') {
        appEl.innerHTML = renderMenu();
      } else if (state.gameState === 'playing') {
        appEl.innerHTML = renderPlaying();
        if (!state.isOver && !state.isChecking) {
          const inputEl = document.getElementById('in');
          if (inputEl) inputEl.focus();
        }
      } else if (state.gameState === 'results') {
        appEl.innerHTML = renderResults();
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
